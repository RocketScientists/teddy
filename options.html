<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Teddy Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="options">
  <h1>Teddy Settings</h1>
  <form id="form">
    <label>API base URL
      <input name="apiBaseUrl" type="url" required placeholder="https://api.openai.com/v1" />
      <small>Any OpenAI-compatible endpoint; <code>/chat/completions</code> is appended. E.g. Ollama: <code>http://localhost:11434/v1</code> (run Ollama with <code>OLLAMA_ORIGINS="chrome-extension://*"</code>, otherwise it returns 403)</small>
    </label>
    <label>API key
      <input name="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
      <small>Stored locally in this browser only. Leave empty for local servers that need no key.</small>
    </label>
    <label>Model
      <input name="model" required placeholder="gpt-4o-mini" />
    </label>
    <label>Max page characters sent
      <input name="maxContentChars" type="number" min="0" max="50000" step="500" />
    </label>
    <label>Preferred group names (optional, one per line)
      <textarea name="categories" rows="6" placeholder="Work&#10;News&#10;Shopping&#10;Dev Docs"></textarea>
    </label>
    <h2>New tabs</h2>
    <label>Open new tabs at
      <select name="newTabPosition">
        <option value="default">Wherever Chrome puts them</option>
        <option value="start">The start of the tab strip (after pinned tabs)</option>
        <option value="end">The end of the tab strip</option>
      </select>
      <small>Applies to tabs opened with the new-tab shortcut or from other apps. Pinned tabs and tabs Chrome puts in a group are left alone.</small>
    </label>
    <label class="checkbox">
      <input name="moveTabsOpenedFromLinks" type="checkbox" />
      Also move tabs opened from a link in another tab
      <small>Off: those stay next to the tab you opened them from.</small>
    </label>
    <button type="submit">Save</button>
    <span id="saved"></span>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
